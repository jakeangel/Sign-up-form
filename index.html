<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <title>Sign in form</title>
</head>
<body> 
    <div class="sidebar-image">
        <div class="odin-title">
            <img src="images/odin-lined.png" alt="odin" class="logo">
            <h1>ODIN</h1>
        </div>
        <p>Photo by Bernd 📷 Dittrich on Unsplash</p>
    </div>

    <div class="contatiner">
        <section class="header-content">
            <p>This is not a real online service. You know you need something like this in your life to help you realize your deepest dreams. Sign up now to get started.</p>
            <p>You know you want to.</p>
        </section>

        <form action="" id="login-form">
            <p>Lets do this!</p>
            <div class="inputs-container">
                <div class="inputs">
                    <label for="first-name">First Name</label>
                    <input id="first-name" type="text">
                </div>
                <div class="inputs">
                    <label for="last-name">Last Name</label>
                    <input id="last-name" type="text">
                </div>
                <div class="inputs">
                    <label for="email">Email</label>
                    <input id="email" type="email">
                </div>
                <div class="inputs">
                    <label for="phone">Phone Number</label>
                    <input id="phone" type="text">
                </div>

                <div class="inputs">
                    <label for="password">Password</label>
                    <input id="password" type="password" required>
                </div>
                <div class="inputs">
                    <label for="confirm-pw">Confirm password</label>
                    <input id="confirm-pw" type="password" required>
                </div>
            </div>
        
        </form>
        <div class="log-in">
            <button type="submit" form="login-form">Create Account</button>
            <p>Already have an account? <a href="#">Log in</a></p>
        </div>


    </div>
    
</body>
</html>
